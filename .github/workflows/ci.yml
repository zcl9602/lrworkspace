name: Rust tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          # Cache public dependencies only; build outputs can contain local paths.
          path: ~/.cargo/registry
          key: lrw-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            lrw-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-
            lrw-registry-v1-${{ runner.os }}-${{ runner.arch }}-
      # Fake SSH executes Linux-side scripts locally; macOS's BSD commands
      # cannot simulate the GNU tools required on real Linux endpoints.
      - name: Prepare Linux script test dependencies on macOS
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        shell: bash
        run: |
          brew install coreutils gnu-tar
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Build matching CLI and MCP
        run: cargo build -p lrworkspace-cli -p lrworkspace-mcp --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare synthetic SSH authentication test server
        run: python -m pip install 'paramiko>=3.5,<5'
      - name: Test artifact privacy gate and quoted build paths
        run: python -m unittest discover -s scripts/tests -v
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Run MCP command-array integration
        run: cargo test -p lrworkspace-cli --test native_batch mcp_command_array --locked -- --ignored --nocapture
      - name: Run MCP compute-node SSH integration
        run: cargo test -p lrworkspace-cli --test native_batch mcp_cluster_ssh --locked -- --ignored --nocapture
      - name: Verify first-call execution paths and PBS flavor persistence
        run: |
          cargo test -p lrworkspace-cli --test native_batch mcp_path_hints --locked -- --ignored --nocapture
          cargo test -p lrworkspace-cli --test native_batch mcp_pbs_run --locked -- --ignored --nocapture
      - name: Verify compute DNS aliases, actual resources and login hop
        run: cargo test -p lrworkspace-cli --test native_batch mcp_compute_ --locked -- --ignored --nocapture
      - name: Run independent MCP commands and durable task monitoring
        run: cargo test -p lrworkspace-cli --test native_batch mcp_concurrent --locked -- --ignored --nocapture
      - name: Run MCP bounded-output session regression
        run: cargo test -p lrworkspace-cli --test native_batch mcp_truncated --locked -- --ignored --nocapture
      - name: Verify binary file transfers and native MCP images
        run: cargo test -p lrworkspace-cli --test native_batch mcp_file_images --locked -- --ignored --nocapture
      - name: Test clean user installation and minimal PATH
        run: cargo test -p lrworkspace-cli --test portable installing_from_unicode --locked -- --ignored --nocapture
      - name: Verify native OpenSSH private password authentication
        run: cargo test -p lrworkspace-cli --test password_native --locked -- --ignored --nocapture
      - name: Check supplied Perl reference parity
        run: cargo test -p lrworkspace-remote reference_perl --locked -- --ignored --nocapture
      - name: Run local rsync protocol roundtrip
        if: runner.os == 'Linux'
        run: cargo test -p lrworkspace-remote real_rsync_roundtrip --locked -- --ignored --nocapture
      - name: Prepare isolated password-authentication fixture
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server
      - name: Verify password SSH, SCP, rsync and logout on disposable localhost
        if: runner.os == 'Linux'
        env:
          LRW_RUN_ISOLATED_SSHD_TEST: '1'
        run: cargo test -p lrworkspace-cli --test private_login isolated_sshd --locked -- --ignored --nocapture
