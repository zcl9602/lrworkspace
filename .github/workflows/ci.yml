name: Rust tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Fake SSH executes Linux-side scripts locally; macOS's BSD commands
      # cannot simulate the GNU tools required on real Linux endpoints.
      - name: Prepare Linux script test dependencies on macOS
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        shell: bash
        run: |
          brew install coreutils gnu-tar
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Build matching CLI and MCP
        run: cargo build -p lrworkspace-cli -p lrworkspace-mcp --locked
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Run MCP command-array integration
        run: cargo test -p lrworkspace-cli --test native_batch mcp_command_array --locked -- --ignored --nocapture
      - name: Run MCP compute-node SSH integration
        run: cargo test -p lrworkspace-cli --test native_batch mcp_cluster_ssh --locked -- --ignored --nocapture
      - name: Run MCP bounded-output session regression
        run: cargo test -p lrworkspace-cli --test native_batch mcp_truncated --locked -- --ignored --nocapture
      - name: Test clean user installation and minimal PATH
        run: cargo test -p lrworkspace-cli --test portable installing_from_unicode --locked -- --ignored --nocapture
      - name: Check supplied Perl reference parity
        run: cargo test -p lrworkspace-remote reference_perl --locked -- --ignored --nocapture
      - name: Run local rsync protocol roundtrip
        if: runner.os == 'Linux'
        run: cargo test -p lrworkspace-remote real_rsync_roundtrip --locked -- --ignored --nocapture
