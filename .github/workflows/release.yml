name: Portable release packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x86_64
          - os: macos-15
            platform: macos
            arch: aarch64
          - os: macos-15-intel
            platform: macos
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Use static Windows C runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value 'RUSTFLAGS=-C target-feature=+crt-static'
      - name: Build matching native executables
        run: cargo build --release --locked -p lrworkspace-cli -p lrworkspace-mcp
      - name: Test release installation in an isolated user profile
        run: cargo test --release --locked -p lrworkspace-cli --test portable -- --include-ignored --nocapture
      - name: Package with source revision and SHA256 manifest
        run: python scripts/package_release.py --bin-dir target/release --out-dir dist --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --source-commit ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: lrworkspace-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
