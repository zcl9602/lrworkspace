[workspace]
resolver = "2"
members = [
    "crates/lrworkspace-core",
    "crates/lrworkspace-remote",
    "crates/lrworkspace-slurm",
    "crates/lrworkspace-audit",
    "crates/lrworkspace-cli",
    "crates/lrworkspace-mcp",
]

[workspace.package]
version = "0.6.3"
edition = "2021"
rust-version = "1.89"
license = "MIT"
authors = ["LrWorkspaceRemote Team"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
ssh2 = "0.9"
openssl = { version = "0.10", features = ["vendored"] }
async-trait = "0.1"
regex = "1"

[profile.release]
debug = 0
strip = "symbols"
